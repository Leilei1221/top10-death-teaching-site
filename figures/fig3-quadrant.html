<!DOCTYPE html>

<style>

<body>
<div class="frame">
<p class="eyebrow">四象限・教學示意</p>
<h1>哪些死因，現在就能開始預防？</h1>
<p class="sub">把常見死因依「多半在幾歲發生」和「靠健康行為能預防多少」放進四個格子。慢性病雖然老了才發生，習慣卻是年輕時養成的。</p>

<desc id="quad-desc">四象限圖：常見死因依好發年齡（年輕到年長）與可預防程度（較難到容易）分布，事故傷害與自殺位於年輕且容易預防的區域。</desc>

</defs>

<text x="640" y="64" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="16" font-weight="700" fill="#26304a" text-anchor="middle" dominant-baseline="middle" >容易預防</text>

</div>
<p class="source">死因清單取自衛生福利部統計處「114 年死因統計結果摘要表」全國及 12–17 歲十大死因；位置為教學判斷，非精確數值。製作：花蓮高中健康與護理科。</p>
